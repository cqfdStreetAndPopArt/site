<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - CQFD</title>
  <link rel="stylesheet" href="../style.css" />
  </head>
<body class="page-contact">

  <header>
    <h1>Contact</h1>
    <nav class="main-nav">
      <a href="../../index.html">🎨 Galerie</a>
      <a href="#">📱 Contact</a>
      <a href="#" onclick="toggleCart(); return false;">⭐️ Favoris (<span id="cart-count">0</span>)</a>
      <a href="../vendu.html">❌ Vendu</a>
    </nav>
  </header>

  <main>
    <div class="contact-wrap">
      <h2>Contactez-nous</h2>
      <p class="hint">Remplissez le formulaire ci-dessous ou envoyez-nous un message via Instagram.</p>

      <form id="contactForm">
        <label for="name">Nom</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Envoyer</button>
      </form>

      <div style="margin-top: 30px;">
        <a href="https://www.instagram.com/cqfd_street_and_pop_art" target="_blank" style="color : linear-gradient(135deg, yellow, orange); font-weight: bold; display: inline-flex; align-items: center;">
        <img src="../photo/insta.JPG.png" alt="Instagram" class="insta-icon">
        <span style="color : linear-gradient(135deg, yellow, orange); font-weight: bold; display: inline-flex; align-items: center;">Instagram @cqfd_street_and_pop_art</span>
        </a>
      </div>

      <div id="form-status" style="margin-top:12px; font-weight: bold;"></div>
    </div>

    <aside id="cart">
      <button id="close-cart">✕</button>
      <h3>⭐️ Vos Favoris</h3>
      <ul id="cart-items"></ul>
      <p>Total : <span id="cart-total">0</span> €</p>
      <a href="#" class="checkout-button" style="display:block; text-align:center; background:#007bff; color:white; padding:10px; border-radius:5px; text-decoration:none;">Passer à la commande</a>
    </aside>
  </main>

  <script>
    // Logique simplifiée pour le fonctionnement
    const form = document.getElementById('contactForm');
    const statusEl = document.getElementById('form-status');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      statusEl.textContent = "Ouverture de votre application de messagerie...";

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      const subject = encodeURIComponent('Contact CQFD — ' + name);
      const body = encodeURIComponent(`Nom: ${name}\nEmail: ${email}\n\n${message}`);
      const mailtoLink = `mailto:cqfd.street.popart@gmail.com?subject=${subject}&body=${body}`;

      window.open(mailtoLink, '_blank', 'noopener,noreferrer');
      statusEl.innerHTML = 'Si votre messagerie ne s’ouvre pas, utilisez ce lien : <a href="' + mailtoLink + '" style="color:#ff6b00;">Envoyer le message</a>';
    });

    // Gestion du panier (Favoris)
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    function updateCartDisplay() {
      const cartCount = document.getElementById('cart-count');
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');
      if(cartCount) cartCount.textContent = cart.length;
      if(cartItems) {
        cartItems.innerHTML = '';
        let total = 0;
        cart.forEach((item, index) => {
          const li = document.createElement('li');
          li.textContent = `${item.title} - ${item.price} €`;
          cartItems.appendChild(li);
          total += item.price;
        });
        cartTotal.textContent = total.toFixed(2);
      }
    }

    function toggleCart() {
      document.getElementById('cart').classList.toggle('open');
    }

    document.getElementById('close-cart').addEventListener('click', () => {
      document.getElementById('cart').classList.remove('open');
    });

    window.onload = updateCartDisplay;
  </script>
</body>
</html>
