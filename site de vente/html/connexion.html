<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border-top: 8px solid #0056b3;
        }

        h1 {
            color: #003366;
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d9e6;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffcc00;
        }

        button {
            width: 100%;
            background-color: #ffcc00;
            color: #003366;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #e6b800;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Connexion</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Se connecter</button>
        </form>
    </div>

    <script>
        // On intercepte l'envoi du formulaire
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Empêche l'envoi classique vers PHP pour le test
            event.preventDefault();

            // Récupération des valeurs
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Condition de test : remplacez par vos propres critères
            // Ici, on vérifie juste que les champs ne sont pas vides (déjà géré par 'required')
            if (email !== "" && password.length >= 4) {
                alert("Connexion réussie ! Redirection...");
                window.location.href = "../../index.html"; // Redirection vers ta page d'accueil
            } else {
                alert("Veuillez remplir les champs correctement (Mot de passe : 4 caractères min).");
            }
        });
    </script>
    
</body>
</html>
