<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="../style.css" />
    </head>
<body>

    <header>
        <h1>CQFD</h1>
        <nav class="main-nav">
            <a href="../../index.html">🎨 Galerie</a>
            <a href="contact.html">📱 Contact</a>
            <a href="../vendu.html">❌ Vendu</a>
        </nav>
    </header>

    <div class="login-container">
        <h1>Connexion</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Se connecter</button>
        </form>
    </div>

    <script>
        // On intercepte l'envoi du formulaire
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Empêche l'envoi classique vers PHP pour le test
            event.preventDefault();

            // Récupération des valeurs
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Condition de test : remplacez par vos propres critères
            // Ici, on vérifie juste que les champs ne sont pas vides (déjà géré par 'required')
            if (email !== "" && password.length >= 4) {
                alert("Connexion réussie ! Redirection...");
                window.location.href = "../../index.html"; // Redirection vers ta page d'accueil
            } else {
                alert("Veuillez remplir les champs correctement (Mot de passe : 4 caractères min).");
            }
        });
    </script>
    
</body>
</html>
