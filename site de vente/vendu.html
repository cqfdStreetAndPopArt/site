<aside id="cart">

<button id="close-cart">✕</button>

<h3>⭐️ Vos Favoris</h3>

<ul id="cart-items"></ul>

<p>Total : <span id="cart-total">0</span> €</p>

<a href="html/contact.html"
style="display:block;text-align:center;background:#007bff;color:white;padding:10px;border-radius:5px;text-decoration:none;">
Passer à la commande
</a>

</aside>



<script>

let cart = JSON.parse(localStorage.getItem('cart')) || [];

function updateCartDisplay(){

const itemsList=document.getElementById('cart-items');
const countSpan=document.getElementById('cart-count');
const totalSpan=document.getElementById('cart-total');

itemsList.innerHTML='';

let sum=0;

cart.forEach((item,index)=>{

const li=document.createElement('li');

li.innerHTML=
`<span>${item.title}</span>
<span>${item.price}€
<button onclick="removeFromCart(${index})"
style="background:none;border:none;color:red;cursor:pointer;margin-left:5px;">
🗑️
</button></span>`;

itemsList.appendChild(li);

sum+=item.price;

});

countSpan.textContent=cart.length;

totalSpan.textContent=sum.toFixed(2);

localStorage.setItem('cart',JSON.stringify(cart));

}


function addToCart(button){
return false;
}


function removeFromCart(index){

cart.splice(index,1);

updateCartDisplay();

}


function toggleCart(){

document.getElementById('cart').classList.toggle('open');

}


document.getElementById('close-cart').onclick=
()=>document.getElementById('cart').classList.remove('open');


window.onload=updateCartDisplay;

</script>


</body>
